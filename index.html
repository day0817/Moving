<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引越先物件 比較・検討ナビゲート</title>
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="Image/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="Image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Image/favicon-16x16.png">
    <link rel="shortcut icon" href="Image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="Image/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#073642">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260922">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-content">
                <h1 class="logo-text">Bukken<span>Compare</span></h1>
                <p class="subtitle">大手町通勤のための賃貸一戸建て（80m²以上・駐車場込）比較ナビ</p>
            </div>
            <div class="header-right">
                <div class="last-updated-badge" title="物件データの最終更新日">
                    <svg class="updated-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span class="updated-label">最終更新:</span>
                    <time id="lastUpdated" datetime="2026-09-22">2026/09/22</time>
                </div>
                <div class="theme-switch-wrapper">
                    <button id="themeToggleBtn" class="theme-toggle-btn" title="テーマ切り替え (Solarized / Solarized Dark)" aria-label="テーマ切り替え">
                        <span class="theme-toggle-indicator">
                            <span class="theme-icon dark-icon">🌙</span>
                            <span class="theme-icon light-icon">☀️</span>
                        </span>
                        <span class="theme-text" id="themeLabel">Solarized Dark</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- フィルタコントロールパネル -->
        <section class="filter-panel glass">
            <div class="filter-header-row">
                <div class="filter-group-header">
                    <h3>エリア切り替え（都道府県）</h3>
                </div>
                <div class="new-filter-control">
                    <label class="new-filter-label" for="onlyNewCheck" id="onlyNewFilterBtn">
                        <input type="checkbox" id="onlyNewCheck">
                        <span class="new-badge-pill">NEW</span>
                        <span class="toggle-text">新規追加のみ表示 (<span id="newBukkenCount">0</span>)</span>
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <div class="tabs" id="areaTabs">
                    <!-- JavaScript側で動的に生成されます -->
                </div>
                <div class="tabs tabs--sub" id="cityTabs" style="display: none;">
                    <!-- 都道府県選択時のみ、JavaScript側で市区町村タブを動的に生成 -->
                </div>
            </div>

            <div class="sort-compare-controls">
                <div class="sort-box sort-box--priority">
                    <label>並び替えの優先順位（ドラッグ、または▲▼ボタンで並び替え。第1条件から順に比較します）</label>
                    <ul class="sort-priority-list" id="sortPriorityList">
                        <!-- JavaScript側で動的に生成されます -->
                    </ul>
                </div>
                <button class="compare-btn-trigger" id="openCompareBtn" disabled>
                    選択した物件を比較 (<span id="compareCount">0</span>)
                </button>
            </div>
        </section>

        <!-- 物件カードグリッド -->
        <section class="bukken-grid" id="bukkenGrid">
            <!-- 動的にJSで生成 -->
        </section>
    </main>

    <!-- 比較モーダル -->
    <div class="modal-overlay" id="compareModal">
        <div class="modal-content glass">
            <button class="close-modal" id="closeModalBtn">&times;</button>
            <h2>選択物件の徹底比較</h2>
            <div class="table-container">
                <table class="compare-table" id="compareTable">
                    <!-- 動的に比較テーブルを生成 -->
                </table>
            </div>
        </div>
    </div>

    <!-- データスクリプトおよびメインスクリプト -->
    <script src="station_commute.js?v=20260922"></script>
    <script src="properties.js?v=20260922"></script>
    <script src="app.js?v=20260922"></script>
</body>
</html>
