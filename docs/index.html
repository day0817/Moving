<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引越先物件 比較・検討ナビゲート</title>
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#fdf6e3">

    <!-- Google Fonts（ロゴ用の表示フォントのみ。本文はシステムフォント） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260927">

    <!-- 描画前に外観（ライト/ダーク）を決めてチラつきを防ぐ。既定はライト。キーは app.js と同じ -->
    <script>
        try {
            if (localStorage.getItem("bukken_theme_v2") === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
            console.warn("外観の設定を読み込めませんでした（ライト表示で開きます）", e);
        }
    </script>
</head>
<body>
    <header class="c-navbar">
        <div class="nav-inner">
            <div class="brand">
                <h1 class="brand-name">Bukken<span>Compare</span></h1>
                <p class="brand-sub">大手町通勤のための賃貸一戸建て（80m²以上・駐車場込）比較ナビ</p>
            </div>
            <div class="nav-right">
                <span class="updated" title="物件データの最終更新日">
                    <svg class="icon-svg icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span class="updated-label">最終更新</span>
                    <time id="lastUpdated" datetime="2026-09-26">2026/09/26</time>
                </span>
                <button type="button" id="themeToggleBtn" class="theme-btn" aria-label="ライト/ダーク切り替え" title="ライト/ダーク切り替え">
                    <svg class="icon-svg icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-svg icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 操作バー（スクロールしても上に残る）: エリア・絞り込み・並び順 -->
    <div class="toolbar-wrap">
        <div class="toolbar">
            <div class="chips" id="areaTabs" role="group" aria-label="エリア（都道府県）">
                <!-- JavaScript側で動的に生成されます -->
            </div>
            <div class="toolbar-right">
                <label class="check" for="hideFloodRiskCheck" title="浸水リスク「高」「極高」の物件を一覧から除きます">
                    <input type="checkbox" id="hideFloodRiskCheck" checked>
                    <span>浸水<span class="check-long">リスク</span>高を除く</span>
                    <span class="count" id="floodRiskCount">0</span>
                </label>
                <label class="check" for="onlyNewCheck" title="今回の更新で新しく追加された物件だけを表示します">
                    <input type="checkbox" id="onlyNewCheck">
                    <span>NEWのみ</span>
                    <span class="count" id="newBukkenCount">0</span>
                </label>
                <details class="sort-pop" id="sortPop">
                    <summary class="c-btn c-btn-secondary c-btn-sm">
                        <svg class="icon-svg icon-sm" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                        並び順
                    </summary>
                    <div class="sort-panel">
                        <p class="sort-panel-note">上の条件から順に比べて並べます。ドラッグ、または矢印ボタンで入れ替えできます。</p>
                        <ol class="sort-list" id="sortPriorityList">
                            <!-- JavaScript側で動的に生成されます -->
                        </ol>
                    </div>
                </details>
            </div>
        </div>
        <!-- 都道府県を選んだときだけ市区町村を表示 -->
        <div class="toolbar toolbar--sub" id="cityTabsRow" hidden>
            <div class="chips" id="cityTabs" role="group" aria-label="市区町村">
                <!-- JavaScript側で動的に生成されます -->
            </div>
        </div>
    </div>

    <main class="page">
        <div class="result-line">
            <span class="result-count"><strong class="num" id="resultCount">0</strong> 件</span>
            <span class="sort-summary" id="sortSummary"></span>
            <span class="legend" id="legend">
                <!-- JavaScript側で動的に生成されます（到着駅アイコン・★の基準） -->
            </span>
        </div>

        <!-- 物件カードグリッド -->
        <section class="bukken-grid" id="bukkenGrid" aria-label="物件一覧">
            <!-- 動的にJSで生成 -->
        </section>
    </main>

    <!-- データスクリプトおよびメインスクリプト -->
    <script src="data/station_commute.js?v=20260927"></script>
    <script src="data/properties.js?v=20260927"></script>
    <script src="data/flood_risk.js?v=20260927"></script>
    <script src="app.js?v=20260927"></script>
</body>
</html>
